<?xml version="1.0" encoding="UTF-8"?>
<svg aria-labelledby="title desc" height="980" role="img" viewBox="0 0 1600 980" width="1600" xmlns="http://www.w3.org/2000/svg">
  <title id="title">Actseal architecture: seven shipped groups and their modules</title>
  <desc id="desc">Seven groups, each listing the actseal modules that implement it. Contracts and locks: contract, records, errors, serialization, locking and compatibility parse, seal and validate the lock with no model call. CLI and typed API: cli, runner, __init__, __main__ and demo_data drive the lock, verify, replay and demo commands. Providers: adapters.base, adapters.fixture, adapters.laya and the PROVISIONAL experimental.providers.jev; the dashed live-inference boundary encloses the Laya and Jev adapters, because the fixture adapter reads a recorded file. Fixture and Laya are the stable providers; Jev is an experimental cloud adapter selected only by explicit opt-in, with no stability promise and no claim here that its service was exercised. Normalization and policy: normalization and policy are pure functions that turn one raw capture into one decision. Assessment, statistics and faults: assessment, stats and faults; the six fault scenarios are synthetic, generated from the lock with no model call, and assessment recomputes every decision before the verdict. Evidence: evidence writes the seven-file bounded data-only bundle atomically. Replay: replay reads the bundle and recomputes the verdict offline through contracts and assessment; no arrow joins replay and providers, and replay imports no provider module.</desc>
  <rect fill="#ffffff" height="980" width="1600" x="0" y="0"/>
  <g font-family="Helvetica, Arial, Liberation Sans, sans-serif" id="group-contracts">
    <rect fill="#f6f8fa" height="388" rx="10" stroke="#d0d7de" stroke-width="2" width="363" x="20" y="24"/>
    <text fill="#1f2328" font-size="32" font-weight="bold" x="36" y="70">Contracts / locks</text>
    <line stroke="#d0d7de" stroke-width="2" x1="36" x2="367" y1="82" y2="82"/>
    <text fill="#0969da" font-size="26" x="36" y="116">contract · records · errors</text>
    <text fill="#0969da" font-size="26" x="36" y="150">serialization · locking</text>
    <text fill="#0969da" font-size="26" x="36" y="184">compatibility</text>
    <text fill="#57606a" font-size="26" x="36" y="228">parse, seal, validate</text>
    <text fill="#57606a" font-size="26" x="36" y="262">no model call</text>
    <g data-source="contracts" data-target="assessment" id="edge-contracts-assessment">
      <polyline fill="none" points="201.5,416 201.5,452 499,452 499,476" stroke="#0969da" stroke-width="3"/>
      <polygon fill="#0969da" points="499,488 492,476 506,476"/>
      <text fill="#57606a" font-size="26" text-anchor="start" x="213.5" y="440">6 synthetic faults</text>
    </g>
  </g>
  <g font-family="Helvetica, Arial, Liberation Sans, sans-serif" id="group-cli">
    <rect fill="#f6f8fa" height="388" rx="10" stroke="#d0d7de" stroke-width="2" width="363" x="419" y="24"/>
    <text fill="#1f2328" font-size="32" font-weight="bold" x="435" y="70">CLI / typed API</text>
    <line stroke="#d0d7de" stroke-width="2" x1="435" x2="766" y1="82" y2="82"/>
    <text fill="#0969da" font-size="26" x="435" y="116">cli · runner · __init__</text>
    <text fill="#0969da" font-size="26" x="435" y="150">__main__ · demo_data</text>
    <text fill="#57606a" font-size="26" x="435" y="194">lock, verify, replay, demo</text>
    <g data-source="cli" data-target="contracts" id="edge-cli-contracts">
      <polyline fill="none" points="415,218 399,218" stroke="#0969da" stroke-width="3"/>
      <polygon fill="#0969da" points="387,218 399,211 399,225"/>
    </g>
    <g data-source="cli" data-target="providers" id="edge-cli-providers">
      <polyline fill="none" points="786,218 802,218" stroke="#0969da" stroke-width="3"/>
      <polygon fill="#0969da" points="814,218 802,211 802,225"/>
    </g>
  </g>
  <g font-family="Helvetica, Arial, Liberation Sans, sans-serif" id="group-providers">
    <rect fill="#f6f8fa" height="388" rx="10" stroke="#d0d7de" stroke-width="2" width="363" x="818" y="24"/>
    <text fill="#1f2328" font-size="32" font-weight="bold" x="834" y="70">Providers</text>
    <line stroke="#d0d7de" stroke-width="2" x1="834" x2="1165" y1="82" y2="82"/>
    <text fill="#0969da" font-size="26" x="834" y="116">adapters.base</text>
    <text fill="#0969da" font-size="26" x="834" y="150">adapters.fixture</text>
    <g id="live-boundary-providers">
      <rect fill="none" height="116" rx="6" stroke="#0969da" stroke-dasharray="8 6" stroke-width="2" width="347" x="826" y="160"/>
      <text fill="#0969da" font-size="26" x="834" y="194">adapters.laya</text>
      <text fill="#0969da" font-size="26" x="834" y="228">experimental.providers.jev</text>
      <text fill="#57606a" font-size="26" x="834" y="262">live inference</text>
    </g>
    <text fill="#57606a" font-size="26" x="834" y="322">fixture: recorded file</text>
    <text fill="#57606a" font-size="26" x="834" y="356">laya: pinned checkpoint</text>
    <text fill="#57606a" font-size="26" x="834" y="390">jev: PROVISIONAL opt-in</text>
    <g data-source="providers" data-target="normalization" id="edge-providers-normalization">
      <polyline fill="none" points="1185,218 1201,218" stroke="#0969da" stroke-width="3"/>
      <polygon fill="#0969da" points="1213,218 1201,211 1201,225"/>
    </g>
  </g>
  <g font-family="Helvetica, Arial, Liberation Sans, sans-serif" id="group-normalization">
    <rect fill="#f6f8fa" height="388" rx="10" stroke="#d0d7de" stroke-width="2" width="363" x="1217" y="24"/>
    <text fill="#1f2328" font-size="32" font-weight="bold" x="1233" y="70">Normalization</text>
    <text fill="#1f2328" font-size="32" font-weight="bold" x="1233" y="106">policy</text>
    <line stroke="#d0d7de" stroke-width="2" x1="1233" x2="1564" y1="118" y2="118"/>
    <text fill="#0969da" font-size="26" x="1233" y="152">normalization · policy</text>
    <text fill="#57606a" font-size="26" x="1233" y="196">pure; no provider import</text>
    <text fill="#57606a" font-size="26" x="1233" y="230">decision per capture</text>
    <g data-source="normalization" data-target="assessment" id="edge-normalization-assessment">
      <polyline fill="none" points="1398.5,416 1398.5,476" stroke="#0969da" stroke-width="3"/>
      <polygon fill="#0969da" points="1398.5,488 1391.5,476 1405.5,476"/>
      <text fill="#57606a" font-size="26" text-anchor="start" x="1410.5" y="465">decisions</text>
    </g>
  </g>
  <g font-family="Helvetica, Arial, Liberation Sans, sans-serif" id="group-assessment">
    <rect fill="#f6f8fa" height="192" rx="10" stroke="#d0d7de" stroke-width="2" width="1161" x="419" y="492"/>
    <text fill="#1f2328" font-size="32" font-weight="bold" x="435" y="538">Assessment / statistics / faults</text>
    <line stroke="#d0d7de" stroke-width="2" x1="435" x2="1564" y1="550" y2="550"/>
    <text fill="#0969da" font-size="26" x="435" y="584">assessment · stats · faults</text>
    <text fill="#57606a" font-size="26" x="435" y="628">6 synthetic faults; no model call</text>
    <text fill="#57606a" font-size="26" x="435" y="662">recomputes decisions, then the verdict</text>
    <g data-source="assessment" data-target="evidence" id="edge-assessment-evidence">
      <polyline fill="none" points="600.5,688 600.5,728" stroke="#0969da" stroke-width="3"/>
      <polygon fill="#0969da" points="600.5,740 593.5,728 607.5,728"/>
      <text fill="#57606a" font-size="26" text-anchor="start" x="612.5" y="727">verdict, records, faults</text>
    </g>
  </g>
  <g font-family="Helvetica, Arial, Liberation Sans, sans-serif" id="group-evidence">
    <rect fill="#f6f8fa" height="192" rx="10" stroke="#d0d7de" stroke-width="2" width="363" x="419" y="744"/>
    <text fill="#1f2328" font-size="32" font-weight="bold" x="435" y="790">Evidence</text>
    <line stroke="#d0d7de" stroke-width="2" x1="435" x2="766" y1="802" y2="802"/>
    <text fill="#0969da" font-size="26" x="435" y="836">evidence</text>
    <text fill="#57606a" font-size="26" x="435" y="880">7-file bundle, bounded</text>
    <text fill="#57606a" font-size="26" x="435" y="914">atomic publish</text>
    <g data-source="evidence" data-target="replay" id="edge-evidence-replay">
      <polyline fill="none" points="415,840 399,840" stroke="#0969da" stroke-width="3"/>
      <polygon fill="#0969da" points="387,840 399,833 399,847"/>
    </g>
  </g>
  <g font-family="Helvetica, Arial, Liberation Sans, sans-serif" id="group-replay">
    <rect fill="#f6f8fa" height="192" rx="10" stroke="#d0d7de" stroke-width="2" width="363" x="20" y="744"/>
    <text fill="#1f2328" font-size="32" font-weight="bold" x="36" y="790">Replay</text>
    <line stroke="#d0d7de" stroke-width="2" x1="36" x2="367" y1="802" y2="802"/>
    <text fill="#0969da" font-size="26" x="36" y="836">replay</text>
    <text fill="#57606a" font-size="26" x="36" y="880">offline; no provider import</text>
    <text fill="#57606a" font-size="26" x="36" y="914">recomputes the verdict</text>
    <g data-source="replay" data-target="contracts" id="edge-replay-contracts">
      <polyline fill="none" points="92.6,740 92.6,428" stroke="#57606a" stroke-width="3"/>
      <polygon fill="#57606a" points="92.6,416 85.6,428 99.6,428"/>
      <text fill="#57606a" font-size="26" text-anchor="start" x="104.6" y="591">lock, inputs</text>
    </g>
    <g data-source="replay" data-target="assessment" id="edge-replay-assessment">
      <polyline fill="none" points="310.4,740 310.4,588 403,588" stroke="#57606a" stroke-width="3"/>
      <polygon fill="#57606a" points="415,588 403,581 403,595"/>
      <text fill="#57606a" font-size="26" text-anchor="end" x="415" y="576">recompute</text>
    </g>
  </g>
</svg>
