<?xml version="1.0" encoding="UTF-8"?>
<svg aria-labelledby="title desc" height="980" role="img" viewBox="0 0 1600 980" width="1600" xmlns="http://www.w3.org/2000/svg">
  <title id="title">Actseal architecture: seven shipped groups and their modules</title>
  <desc id="desc">Seven groups, each listing the actseal modules that implement it. Contracts and locks: contract, records, errors, serialization, locking and compatibility parse, seal and validate the lock with no model call. CLI and typed API: cli, runner, qualification, report, __init__, __main__ and demo_data drive orchestration and presentation. Providers: adapters.base, adapters.fixture, adapters.recorded, adapters.laya and the PROVISIONAL experimental.providers.jev and experimental.providers.decision_api; the dashed live-inference boundary encloses the Laya, Jev and decision-API adapters; the fixture adapter reads a recorded file, as does the recorded adapter. Fixture and Laya are the stable providers; Jev is an experimental cloud adapter selected only by explicit opt-in, with no stability promise and no claim here that its service was exercised. The decision-API adapter is also PROVISIONAL. Normalization and policy: normalization and policy are pure functions that turn one raw capture into one decision. Assessment, statistics and faults: assessment, stats, faults and selection; the six fault scenarios are synthetic, generated from the lock with no model call, and assessment recomputes every decision before the verdict. Evidence: evidence writes the seven-file bounded data-only bundle atomically. Replay: replay reads the bundle and recomputes the verdict offline through contracts and assessment; no arrow joins replay and providers, and replay imports no provider module.</desc>
  <rect fill="#0d1117" height="980" width="1600" x="0" y="0"/>
  <g font-family="Helvetica, Arial, Liberation Sans, sans-serif" id="group-contracts">
    <rect fill="#161b22" height="392" rx="10" stroke="#30363d" stroke-width="2" width="371" x="16" y="24"/>
    <text fill="#e6edf3" font-size="32" font-weight="bold" x="28" y="70">Contracts / locks</text>
    <line stroke="#30363d" stroke-width="2" x1="28" x2="375" y1="82" y2="82"/>
    <text fill="#58a6ff" font-size="27" x="28" y="117">contract · records · errors</text>
    <text fill="#58a6ff" font-size="27" x="28" y="151">serialization · locking</text>
    <text fill="#58a6ff" font-size="27" x="28" y="185">compatibility</text>
    <text fill="#8b949e" font-size="27" x="28" y="229">parse, seal, validate</text>
    <text fill="#8b949e" font-size="27" x="28" y="263">no model call</text>
    <g data-source="contracts" data-target="assessment" id="edge-contracts-assessment">
      <polyline fill="none" points="201.5,420 201.5,456 495,456 495,480" stroke="#58a6ff" stroke-width="3"/>
      <polygon fill="#58a6ff" points="495,492 488,480 502,480"/>
      <text fill="#8b949e" font-size="27" text-anchor="start" x="213.5" y="444">6 synthetic faults</text>
    </g>
  </g>
  <g font-family="Helvetica, Arial, Liberation Sans, sans-serif" id="group-cli">
    <rect fill="#161b22" height="392" rx="10" stroke="#30363d" stroke-width="2" width="253" x="415" y="24"/>
    <text fill="#e6edf3" font-size="32" font-weight="bold" x="427" y="70">CLI</text>
    <text fill="#e6edf3" font-size="32" font-weight="bold" x="427" y="106">typed API</text>
    <line stroke="#30363d" stroke-width="2" x1="427" x2="656" y1="118" y2="118"/>
    <text fill="#58a6ff" font-size="27" x="427" y="153">cli · runner</text>
    <text fill="#58a6ff" font-size="27" x="427" y="187">qualification</text>
    <text fill="#58a6ff" font-size="27" x="427" y="221">report · __init__</text>
    <text fill="#58a6ff" font-size="27" x="427" y="255">__main__</text>
    <text fill="#58a6ff" font-size="27" x="427" y="289">demo_data</text>
    <text fill="#8b949e" font-size="27" x="427" y="333">orchestration</text>
    <text fill="#8b949e" font-size="27" x="427" y="367">presentation</text>
    <g data-source="cli" data-target="contracts" id="edge-cli-contracts">
      <polyline fill="none" points="411,220 403,220" stroke="#58a6ff" stroke-width="3"/>
      <polygon fill="#58a6ff" points="391,220 403,213 403,227"/>
    </g>
    <g data-source="cli" data-target="providers" id="edge-cli-providers">
      <polyline fill="none" points="672,220 680,220" stroke="#58a6ff" stroke-width="3"/>
      <polygon fill="#58a6ff" points="692,220 680,213 680,227"/>
    </g>
  </g>
  <g font-family="Helvetica, Arial, Liberation Sans, sans-serif" id="group-providers">
    <rect fill="#161b22" height="392" rx="10" stroke="#30363d" stroke-width="2" width="580" x="696" y="24"/>
    <text fill="#e6edf3" font-size="32" font-weight="bold" x="708" y="70">Providers</text>
    <line stroke="#30363d" stroke-width="2" x1="708" x2="1264" y1="82" y2="82"/>
    <text fill="#58a6ff" font-size="27" x="708" y="117">adapters.base · adapters.fixture</text>
    <text fill="#58a6ff" font-size="27" x="708" y="151">adapters.recorded</text>
    <g id="live-boundary-providers">
      <rect fill="none" height="118" rx="6" stroke="#58a6ff" stroke-dasharray="8 6" stroke-width="2" width="572" x="700" y="160"/>
      <text fill="#58a6ff" font-size="27" x="708" y="195">adapters.laya · experimental.providers.jev</text>
      <text fill="#58a6ff" font-size="27" x="708" y="229">experimental.providers.decision_api</text>
      <text fill="#8b949e" font-size="27" x="708" y="263">live inference</text>
    </g>
    <text fill="#8b949e" font-size="27" x="708" y="325">fixture: recorded file</text>
    <text fill="#8b949e" font-size="27" x="708" y="359">laya: pinned checkpoint</text>
    <text fill="#8b949e" font-size="27" x="708" y="393">jev / decision-api: PROVISIONAL opt-in</text>
    <g data-source="providers" data-target="normalization" id="edge-providers-normalization">
      <polyline fill="none" points="1280,220 1288,220" stroke="#58a6ff" stroke-width="3"/>
      <polygon fill="#58a6ff" points="1300,220 1288,213 1288,227"/>
    </g>
  </g>
  <g font-family="Helvetica, Arial, Liberation Sans, sans-serif" id="group-normalization">
    <rect fill="#161b22" height="392" rx="10" stroke="#30363d" stroke-width="2" width="280" x="1304" y="24"/>
    <text fill="#e6edf3" font-size="32" font-weight="bold" x="1316" y="70">Normalization</text>
    <text fill="#e6edf3" font-size="32" font-weight="bold" x="1316" y="106">policy</text>
    <line stroke="#30363d" stroke-width="2" x1="1316" x2="1572" y1="118" y2="118"/>
    <text fill="#58a6ff" font-size="27" x="1316" y="153">normalization</text>
    <text fill="#58a6ff" font-size="27" x="1316" y="187">policy</text>
    <text fill="#8b949e" font-size="27" x="1316" y="231">pure; no provider</text>
    <text fill="#8b949e" font-size="27" x="1316" y="265">import</text>
    <text fill="#8b949e" font-size="27" x="1316" y="299">decision per</text>
    <text fill="#8b949e" font-size="27" x="1316" y="333">capture</text>
    <g data-source="normalization" data-target="assessment" id="edge-normalization-assessment">
      <polyline fill="none" points="1444,420 1444,480" stroke="#58a6ff" stroke-width="3"/>
      <polygon fill="#58a6ff" points="1444,492 1437,480 1451,480"/>
      <text fill="#8b949e" font-size="27" text-anchor="start" x="1456" y="469.5">decisions</text>
    </g>
  </g>
  <g font-family="Helvetica, Arial, Liberation Sans, sans-serif" id="group-assessment">
    <rect fill="#161b22" height="194" rx="10" stroke="#30363d" stroke-width="2" width="1169" x="415" y="496"/>
    <text fill="#e6edf3" font-size="32" font-weight="bold" x="427" y="542">Assessment / statistics / faults</text>
    <line stroke="#30363d" stroke-width="2" x1="427" x2="1572" y1="554" y2="554"/>
    <text fill="#58a6ff" font-size="27" x="427" y="589">assessment · stats · faults · selection</text>
    <text fill="#8b949e" font-size="27" x="427" y="633">6 synthetic faults; no model call</text>
    <text fill="#8b949e" font-size="27" x="427" y="667">recomputes decisions, then the verdict</text>
    <g data-source="assessment" data-target="evidence" id="edge-assessment-evidence">
      <polyline fill="none" points="845.5,694 845.5,734" stroke="#58a6ff" stroke-width="3"/>
      <polygon fill="#58a6ff" points="845.5,746 838.5,734 852.5,734"/>
      <text fill="#8b949e" font-size="27" text-anchor="start" x="857.5" y="733.5">verdict, records, faults</text>
    </g>
  </g>
  <g font-family="Helvetica, Arial, Liberation Sans, sans-serif" id="group-evidence">
    <rect fill="#161b22" height="194" rx="10" stroke="#30363d" stroke-width="2" width="861" x="415" y="750"/>
    <text fill="#e6edf3" font-size="32" font-weight="bold" x="427" y="796">Evidence</text>
    <line stroke="#30363d" stroke-width="2" x1="427" x2="1264" y1="808" y2="808"/>
    <text fill="#58a6ff" font-size="27" x="427" y="843">evidence</text>
    <text fill="#8b949e" font-size="27" x="427" y="887">7-file bundle, bounded</text>
    <text fill="#8b949e" font-size="27" x="427" y="921">atomic publish</text>
    <g data-source="evidence" data-target="replay" id="edge-evidence-replay">
      <polyline fill="none" points="411,847 403,847" stroke="#58a6ff" stroke-width="3"/>
      <polygon fill="#58a6ff" points="391,847 403,840 403,854"/>
    </g>
  </g>
  <g font-family="Helvetica, Arial, Liberation Sans, sans-serif" id="group-replay">
    <rect fill="#161b22" height="194" rx="10" stroke="#30363d" stroke-width="2" width="371" x="16" y="750"/>
    <text fill="#e6edf3" font-size="32" font-weight="bold" x="28" y="796">Replay</text>
    <line stroke="#30363d" stroke-width="2" x1="28" x2="375" y1="808" y2="808"/>
    <text fill="#58a6ff" font-size="27" x="28" y="843">replay</text>
    <text fill="#8b949e" font-size="27" x="28" y="887">offline; no provider import</text>
    <text fill="#8b949e" font-size="27" x="28" y="921">recomputes the verdict</text>
    <g data-source="replay" data-target="contracts" id="edge-replay-contracts">
      <polyline fill="none" points="90.2,746 90.2,432" stroke="#8b949e" stroke-width="3"/>
      <polygon fill="#8b949e" points="90.2,420 83.2,432 97.2,432"/>
      <text fill="#8b949e" font-size="27" text-anchor="start" x="102.2" y="596.5">lock, inputs</text>
    </g>
    <g data-source="replay" data-target="assessment" id="edge-replay-assessment">
      <polyline fill="none" points="312.8,746 312.8,593 399,593" stroke="#8b949e" stroke-width="3"/>
      <polygon fill="#8b949e" points="411,593 399,586 399,600"/>
      <text fill="#8b949e" font-size="27" text-anchor="end" x="411" y="581">recompute</text>
    </g>
  </g>
</svg>
