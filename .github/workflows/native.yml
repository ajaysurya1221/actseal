name: Native CPU integration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      UV_PYTHON: '3.12'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.5'
          python-version: '3.12'
          enable-cache: true
      - name: Install the locked open-source CPU stack
        run: uv sync --frozen --group dev --extra laya
      - name: Prepare the exact public checkpoint
        run: |
          uv run --frozen --extra laya python - <<'PY'
          from huggingface_hub import snapshot_download

          snapshot_download(
              repo_id="convaiinnovations/laya-typed-decisions",
              revision="e929ae5cf69bc34259cd2f95c9e91145b818b1f0",
              allow_patterns=[
                  "model.safetensors",
                  "encoder/config.json",
                  "rl_agent_config.json",
                  "tokenizer/tokenizer.json",
                  "tokenizer/tokenizer_config.json",
              ],
          )
          PY
      - name: Exercise the real provider with cached artifacts only
        env:
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
        run: uv run --frozen --extra laya pytest -m integration tests/integration/test_laya.py
