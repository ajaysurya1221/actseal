# The upstream notice is fetched verbatim from the pinned commit. Its hash was
# not part of the approved audit, so setup records it in the receipt and the
# check verifies the notice text markers instead of a pre-pinned digest.
[[jetbrains-mono.artifacts]]
platform = "any"
url = "https://raw.githubusercontent.com/JetBrains/JetBrainsMono/cd5227bd1f61dff3bbd6c814ceaf7ffd95e947d9/OFL.txt"
filename = "OFL.txt"
verify = "receipt"

