name: Publish to PyPI

# Release pipeline: validate the tag/source/package identity, build the two
# distributions exactly once, verify those immutable bytes on every supported
# platform, upload them through Trusted Publishing after approval, verify the
# public PyPI copy in a clean container, then mirror identical assets to a
# draft GitHub release. workflow_dispatch is a rehearsal and never uploads.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pypi-actseal-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build (validate identity, build once)
    if: github.repository == 'ajaysurya1221/actseal'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      version: ${{ steps.identity.outputs.version }}
      release: ${{ steps.identity.outputs.release }}
      wheel: ${{ steps.distributions.outputs.wheel }}
      sdist: ${{ steps.distributions.outputs.sdist }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
      metadata-artifact-id: ${{ steps.upload-metadata.outputs.artifact-id }}
      metadata-artifact-digest: ${{ steps.upload-metadata.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.5'
          python-version: '3.12'
          enable-cache: false
      - name: Install locked development tools
        run: uv sync --frozen --group dev
      - name: Check the workflow contract
        run: uv run --frozen python tools/check_release.py workflow
      - name: Validate tag, source, lock and package version agreement
        id: identity
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          uv run --frozen python tools/check_release.py metadata \
            --ref "$RELEASE_REF" --sha "$RELEASE_SHA" >> "$GITHUB_OUTPUT"
      - name: Build the wheel and source distribution exactly once
        # uv writes a .gitignore into its out-dir; the packages-dir must hold
        # only the two distributions, so remove that marker before validation.
        run: |
          uv build --no-sources --out-dir "$RUNNER_TEMP/dist"
          rm -f "$RUNNER_TEMP/dist/.gitignore"
      - name: Validate the built distributions and record checksums
        id: distributions
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_VERSION: ${{ steps.identity.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/release-metadata"
          uv run --frozen python tools/check_release.py distributions "$RUNNER_TEMP/dist" \
            --version "$RELEASE_VERSION" --ref "$RELEASE_REF" --sha "$RELEASE_SHA" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --sha256sums "$RUNNER_TEMP/release-metadata/SHA256SUMS" \
            --build-receipt "$RUNNER_TEMP/release-metadata/build-receipt.json" >> "$GITHUB_OUTPUT"
      - name: Strict PyPI metadata check
        run: uvx --from twine==7.0.0 twine check --strict "$RUNNER_TEMP"/dist/*
      - name: Upload the immutable distributions (wheel and sdist only)
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions-${{ steps.identity.outputs.version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dist/
          if-no-files-found: error
          compression-level: 0
          overwrite: false
          retention-days: 90
      - name: Upload the build receipt and checksums
        id: upload-metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-metadata-${{ steps.identity.outputs.version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-metadata/
          if-no-files-found: error
          overwrite: false
          retention-days: 90

  verify:
    name: verify (${{ matrix.os }}, Python ${{ matrix.python }})
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      UV_PYTHON: ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.5'
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Install locked development tools
        run: uv sync --frozen --group dev
      - name: Lint and formatting
        run: |
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .
      - name: Strict type checks
        run: uv run --frozen mypy --strict src tests
      - name: Offline unit and acceptance tests
        run: uv run --frozen pytest -m "not integration and not packaging"
      - name: Repository hooks
        run: uv run --frozen pre-commit run --all-files
      - name: Download the exact built distributions by artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: ${{ runner.temp }}/dist
      - name: Download the build checksums by artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.metadata-artifact-id }}
          path: ${{ runner.temp }}/release-metadata
      - name: Verify the downloaded distributions against the build checksums
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          uv run --frozen python tools/check_release.py verify-distributions "$RUNNER_TEMP/dist" \
            --version "$RELEASE_VERSION" --sha256sums "$RUNNER_TEMP/release-metadata/SHA256SUMS"
      - name: Supplied-wheel packaging acceptance (no rebuild)
        env:
          ACTSEAL_TEST_WHEEL: ${{ runner.temp }}/dist/${{ needs.build.outputs.wheel }}
        run: uv run --frozen pytest -m packaging

  publish:
    name: publish (Trusted Publishing, approval gate)
    needs: [build, verify]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.build.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/actseal/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - name: Download the exact verified distributions by artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: dist
      - name: Download the build checksums by artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.metadata-artifact-id }}
          path: release-metadata
      - name: Confirm the bytes about to be uploaded are the verified bytes
        env:
          WHEEL: ${{ needs.build.outputs.wheel }}
          SDIST: ${{ needs.build.outputs.sdist }}
        run: |
          set -euo pipefail
          test "$(find dist -mindepth 1 | wc -l)" -eq 2
          test -f "dist/$WHEEL"
          test -f "dist/$SDIST"
          cd dist
          sha256sum --check --strict ../release-metadata/SHA256SUMS
      - name: Publish with PyPI Trusted Publishing and attestations
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          print-hash: true
          attestations: true
          skip-existing: false

  verify-published:
    name: verify-published (clean container, official PyPI)
    needs: [build, publish]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    container:
      image: python@sha256:d657ab0ade19f404a6ccc883ab399540de667aff751748ce23c07330c5a89e64
    outputs:
      receipt-artifact-id: ${{ steps.upload-receipt.outputs.artifact-id }}
      receipt-artifact-digest: ${{ steps.upload-receipt.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the build checksums by artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.metadata-artifact-id }}
          path: ${{ runner.temp }}/release-metadata
      - name: Install the published version from PyPI outside the checkout and verify it
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/postpublish"
          python tools/check_release.py postpublish \
            --version "$RELEASE_VERSION" \
            --sha256sums "$RUNNER_TEMP/release-metadata/SHA256SUMS" \
            --checkout "$GITHUB_WORKSPACE" \
            --workdir /tmp/actseal-postpublish \
            --out "$RUNNER_TEMP/postpublish/postpublish-receipt.json"
      - name: Upload the post-publication receipt
        id: upload-receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: postpublish-receipt-${{ needs.build.outputs.version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/postpublish/
          if-no-files-found: error
          overwrite: false
          retention-days: 90

  mirror:
    name: mirror (draft GitHub release with identical assets)
    needs: [build, verify, publish, verify-published]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.5'
          python-version: '3.12'
          enable-cache: false
      - name: Install locked development tools
        run: uv sync --frozen --group dev
      - name: Download the exact published distributions by artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: ${{ runner.temp }}/dist
      - name: Download the build checksums by artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.metadata-artifact-id }}
          path: ${{ runner.temp }}/release-metadata
      - name: Download the post-publication receipt by artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.verify-published.outputs.receipt-artifact-id }}
          path: ${{ runner.temp }}/postpublish
      - name: Bind the immutable artifact identity into the release receipt
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          ARTIFACT_ID: ${{ needs.build.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ needs.build.outputs.artifact-digest }}
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: |
          uv run --frozen python tools/check_release.py release-receipt \
            --version "$RELEASE_VERSION" \
            --dist "$RUNNER_TEMP/dist" \
            --sha256sums "$RUNNER_TEMP/release-metadata/SHA256SUMS" \
            --build-receipt "$RUNNER_TEMP/release-metadata/build-receipt.json" \
            --postpublish "$RUNNER_TEMP/postpublish/postpublish-receipt.json" \
            --artifact-id "$ARTIFACT_ID" --artifact-digest "$ARTIFACT_DIGEST" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --verify-result "$VERIFY_RESULT" \
            --out "$RUNNER_TEMP/release-metadata/release-receipt.json"
      - name: Create or update only a draft GitHub release with identical assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          uv run --frozen python tools/check_release.py mirror \
            --tag "$RELEASE_TAG" \
            --dist "$RUNNER_TEMP/dist" \
            --sha256sums "$RUNNER_TEMP/release-metadata/SHA256SUMS" \
            --release-receipt "$RUNNER_TEMP/release-metadata/release-receipt.json"
      - name: Upload the bound release receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-receipt-${{ needs.build.outputs.version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-metadata/release-receipt.json
          if-no-files-found: error
          overwrite: false
          retention-days: 90
