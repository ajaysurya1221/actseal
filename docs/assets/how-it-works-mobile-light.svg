<?xml version="1.0" encoding="UTF-8"?>
<svg aria-labelledby="title desc" height="1904" role="img" viewBox="0 0 720 1904" width="720" xmlns="http://www.w3.org/2000/svg">
  <title id="title">How Actseal works: freeze, run, verify, seal, replay</title>
  <desc id="desc">Five stages in order. Freeze locks the allowed labels, threshold, limits, scheduled cases and model identity into lock.json with its sha256. Run decides every locked case plus six fault scenarios with the frozen policy: ACT, ABSTAIN, ESCALATE or DENY. Verify bounds risk and coverage and applies the fault rules to reach one verdict and exit code: PASS 0, BLOCK 1, INCONCLUSIVE 2 or ERROR 3. Seal writes the evidence bundle of lock, cases, records, faults, verdict and manifest, every file hashed and size-bounded. Replay recomputes the verdict from the bundle offline with no model call and no provider loaded, exiting with the same codes. The lock command performs Freeze, the verify command performs Run, Verify and Seal, and the replay command performs Replay.</desc>
  <rect fill="#ffffff" height="1904" width="720" x="0" y="0"/>
  <g font-family="Helvetica, Arial, Liberation Sans, sans-serif" id="stage-freeze">
    <rect fill="#f6f8fa" height="334" rx="10" stroke="#d0d7de" stroke-width="2" width="672" x="24" y="24"/>
    <text fill="#1f2328" font-size="44" font-weight="bold" x="44" y="86"><tspan fill="#0969da">1</tspan> <tspan dx="6">Freeze</tspan></text>
    <text fill="#57606a" font-size="30" x="44" y="126">actseal lock · locking</text>
    <line stroke="#d0d7de" stroke-width="2" x1="44" x2="676" y1="142" y2="142"/>
    <text fill="#24292f" font-size="30" x="44" y="180">allowed labels</text>
    <text fill="#24292f" font-size="30" x="44" y="218">threshold + limits</text>
    <text fill="#24292f" font-size="30" x="44" y="256">scheduled cases</text>
    <text fill="#24292f" font-size="30" x="44" y="294">model identity</text>
    <text fill="#24292f" font-size="30" x="44" y="332">lock.json + sha256</text>
    <line stroke="#0969da" stroke-width="3" x1="360" x2="360" y1="361" y2="399"/>
    <polygon fill="#0969da" points="360,411 352,399 368,399"/>
  </g>
  <g font-family="Helvetica, Arial, Liberation Sans, sans-serif" id="stage-run">
    <rect fill="#f6f8fa" height="296" rx="10" stroke="#d0d7de" stroke-width="2" width="672" x="24" y="414"/>
    <text fill="#1f2328" font-size="44" font-weight="bold" x="44" y="476"><tspan fill="#0969da">2</tspan> <tspan dx="6">Run</tspan></text>
    <text fill="#57606a" font-size="30" x="44" y="516">actseal verify · policy</text>
    <line stroke="#d0d7de" stroke-width="2" x1="44" x2="676" y1="532" y2="532"/>
    <text fill="#24292f" font-size="30" x="44" y="570">every locked case</text>
    <text fill="#24292f" font-size="30" x="44" y="608">+ 6 fault scenarios</text>
    <text fill="#24292f" font-size="30" x="44" y="646">decision per case:</text>
    <text fill="#0969da" font-size="30" x="44" y="684">ACT · ABSTAIN · ESCALATE · DENY</text>
    <line stroke="#0969da" stroke-width="3" x1="360" x2="360" y1="713" y2="751"/>
    <polygon fill="#0969da" points="360,763 352,751 368,751"/>
  </g>
  <g font-family="Helvetica, Arial, Liberation Sans, sans-serif" id="stage-verify">
    <rect fill="#f6f8fa" height="334" rx="10" stroke="#d0d7de" stroke-width="2" width="672" x="24" y="766"/>
    <text fill="#1f2328" font-size="44" font-weight="bold" x="44" y="828"><tspan fill="#0969da">3</tspan> <tspan dx="6">Verify</tspan></text>
    <text fill="#57606a" font-size="30" x="44" y="868">actseal verify · assessment</text>
    <line stroke="#d0d7de" stroke-width="2" x1="44" x2="676" y1="884" y2="884"/>
    <text fill="#24292f" font-size="30" x="44" y="922">risk + coverage</text>
    <text fill="#24292f" font-size="30" x="44" y="960">bounds, fault rules</text>
    <text fill="#24292f" font-size="30" x="44" y="998">verdict, exit code:</text>
    <text fill="#0969da" font-size="30" x="44" y="1036">PASS 0 · BLOCK 1 · INCONCLUSIVE 2</text>
    <text fill="#0969da" font-size="30" x="44" y="1074">ERROR 3</text>
    <line stroke="#0969da" stroke-width="3" x1="360" x2="360" y1="1103" y2="1141"/>
    <polygon fill="#0969da" points="360,1153 352,1141 368,1141"/>
  </g>
  <g font-family="Helvetica, Arial, Liberation Sans, sans-serif" id="stage-seal">
    <rect fill="#f6f8fa" height="334" rx="10" stroke="#d0d7de" stroke-width="2" width="672" x="24" y="1156"/>
    <text fill="#1f2328" font-size="44" font-weight="bold" x="44" y="1218"><tspan fill="#0969da">4</tspan> <tspan dx="6">Seal</tspan></text>
    <text fill="#57606a" font-size="30" x="44" y="1258">actseal verify · evidence</text>
    <line stroke="#d0d7de" stroke-width="2" x1="44" x2="676" y1="1274" y2="1274"/>
    <text fill="#24292f" font-size="30" x="44" y="1312">lock + cases</text>
    <text fill="#24292f" font-size="30" x="44" y="1350">records + faults</text>
    <text fill="#24292f" font-size="30" x="44" y="1388">verdict + manifest</text>
    <text fill="#24292f" font-size="30" x="44" y="1426">every file hashed</text>
    <text fill="#24292f" font-size="30" x="44" y="1464">bounded size</text>
    <line stroke="#0969da" stroke-width="3" x1="360" x2="360" y1="1493" y2="1531"/>
    <polygon fill="#0969da" points="360,1543 352,1531 368,1531"/>
  </g>
  <g font-family="Helvetica, Arial, Liberation Sans, sans-serif" id="stage-replay">
    <rect fill="#f6f8fa" height="334" rx="10" stroke="#d0d7de" stroke-width="2" width="672" x="24" y="1546"/>
    <text fill="#1f2328" font-size="44" font-weight="bold" x="44" y="1608"><tspan fill="#0969da">5</tspan> <tspan dx="6">Replay</tspan></text>
    <text fill="#57606a" font-size="30" x="44" y="1648">actseal replay</text>
    <line stroke="#d0d7de" stroke-width="2" x1="44" x2="676" y1="1664" y2="1664"/>
    <text fill="#0969da" font-size="30" x="44" y="1702">offline; no model call</text>
    <text fill="#24292f" font-size="30" x="44" y="1740">no provider loaded</text>
    <text fill="#24292f" font-size="30" x="44" y="1778">rechecks every hash</text>
    <text fill="#24292f" font-size="30" x="44" y="1816">recomputes verdict</text>
    <text fill="#24292f" font-size="30" x="44" y="1854">exit codes 0/1/2/3</text>
  </g>
</svg>
