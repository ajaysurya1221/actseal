<?xml version="1.0" encoding="UTF-8"?>
<svg aria-labelledby="title desc" height="3512" role="img" viewBox="0 0 720 3512" width="720" xmlns="http://www.w3.org/2000/svg">
  <title id="title">Actseal architecture: seven shipped groups and their modules</title>
  <desc id="desc">Seven groups, each listing the actseal modules that implement it. Contracts and locks: contract, records, errors, serialization, locking and compatibility parse, seal and validate the lock with no model call. CLI and typed API: cli, runner, qualification, report, __init__, __main__ and demo_data drive orchestration and presentation. Providers: adapters.base, adapters.fixture, adapters.recorded, adapters.laya and the PROVISIONAL experimental.providers.jev and experimental.providers.decision_api; the dashed live-inference boundary encloses the Laya, Jev and decision-API adapters; the fixture adapter reads a recorded file, as does the recorded adapter. Fixture and Laya are the stable providers; Jev is an experimental cloud adapter selected only by explicit opt-in, with no stability promise and no claim here that its service was exercised. The decision-API adapter is also PROVISIONAL. Normalization and policy: normalization and policy are pure functions that turn one raw capture into one decision. Assessment, statistics and faults: assessment, stats, faults and selection; the six fault scenarios are synthetic, generated from the lock with no model call, and assessment recomputes every decision before the verdict. Evidence: evidence writes the seven-file bounded data-only bundle atomically. Replay: replay reads the bundle and recomputes the verdict offline through contracts and assessment; no arrow joins replay and providers, and replay imports no provider module.</desc>
  <rect fill="#ffffff" height="3512" width="720" x="0" y="0"/>
  <g font-family="Helvetica, Arial, Liberation Sans, sans-serif" id="group-contracts">
    <rect fill="#f6f8fa" height="372" rx="10" stroke="#d0d7de" stroke-width="2" width="648" x="36" y="24"/>
    <text fill="#1f2328" font-size="44" font-weight="bold" x="56" y="84">Contracts / locks</text>
    <line stroke="#d0d7de" stroke-width="2" x1="56" x2="664" y1="98" y2="98"/>
    <text fill="#0969da" font-size="40" x="56" y="148">contract · records · errors</text>
    <text fill="#0969da" font-size="40" x="56" y="200">serialization · locking</text>
    <text fill="#0969da" font-size="40" x="56" y="252">compatibility</text>
    <text fill="#57606a" font-size="40" x="56" y="316">parse, seal, validate</text>
    <text fill="#57606a" font-size="40" x="56" y="368">no model call</text>
    <g data-source="contracts" data-target="assessment" id="edge-contracts-assessment">
      <polyline fill="none" points="688,372 708,372 708,2294 700,2294" stroke="#0969da" stroke-width="3"/>
      <polygon fill="#0969da" points="688,2294 700,2287 700,2301"/>
      <text fill="#57606a" font-size="40" text-anchor="end" x="684" y="448">6 synthetic faults</text>
    </g>
  </g>
  <g font-family="Helvetica, Arial, Liberation Sans, sans-serif" id="group-cli">
    <rect fill="#f6f8fa" height="372" rx="10" stroke="#d0d7de" stroke-width="2" width="648" x="36" y="526"/>
    <text fill="#1f2328" font-size="44" font-weight="bold" x="56" y="586">CLI / typed API</text>
    <line stroke="#d0d7de" stroke-width="2" x1="56" x2="664" y1="600" y2="600"/>
    <text fill="#0969da" font-size="40" x="56" y="650">cli · runner · qualification</text>
    <text fill="#0969da" font-size="40" x="56" y="702">report · __init__ · __main__</text>
    <text fill="#0969da" font-size="40" x="56" y="754">demo_data</text>
    <text fill="#57606a" font-size="40" x="56" y="818">orchestration</text>
    <text fill="#57606a" font-size="40" x="56" y="870">presentation</text>
    <g data-source="cli" data-target="contracts" id="edge-cli-contracts">
      <polyline fill="none" points="350,522 350,412" stroke="#0969da" stroke-width="3"/>
      <polygon fill="#0969da" points="350,400 343,412 357,412"/>
    </g>
    <g data-source="cli" data-target="providers" id="edge-cli-providers">
      <polyline fill="none" points="350,902 350,1012" stroke="#0969da" stroke-width="3"/>
      <polygon fill="#0969da" points="350,1024 343,1012 357,1012"/>
    </g>
  </g>
  <g font-family="Helvetica, Arial, Liberation Sans, sans-serif" id="group-providers">
    <rect fill="#f6f8fa" height="714" rx="10" stroke="#d0d7de" stroke-width="2" width="648" x="36" y="1028"/>
    <text fill="#1f2328" font-size="44" font-weight="bold" x="56" y="1088">Providers</text>
    <line stroke="#d0d7de" stroke-width="2" x1="56" x2="664" y1="1102" y2="1102"/>
    <text fill="#0969da" font-size="40" x="56" y="1152">adapters.base · adapters.fixture</text>
    <text fill="#0969da" font-size="40" x="56" y="1204">adapters.recorded</text>
    <g id="live-boundary-providers">
      <rect fill="none" height="274" rx="6" stroke="#0969da" stroke-dasharray="8 6" stroke-width="2" width="624" x="48" y="1220"/>
      <text fill="#0969da" font-size="40" x="56" y="1268">adapters.laya</text>
      <text fill="#0969da" font-size="40" x="56" y="1320">experimental.providers.jev</text>
      <text fill="#0969da" font-size="40" x="56" y="1372">experimental.providers.</text>
      <text fill="#0969da" font-size="40" x="56" y="1424">decision_api</text>
      <text fill="#57606a" font-size="40" x="56" y="1476">live inference</text>
    </g>
    <text fill="#57606a" font-size="40" x="56" y="1558">fixture: recorded file</text>
    <text fill="#57606a" font-size="40" x="56" y="1610">laya: pinned checkpoint</text>
    <text fill="#57606a" font-size="40" x="56" y="1662">jev / decision-api:</text>
    <text fill="#57606a" font-size="40" x="56" y="1714">PROVISIONAL opt-in</text>
    <g data-source="providers" data-target="normalization" id="edge-providers-normalization">
      <polyline fill="none" points="350,1746 350,1856" stroke="#0969da" stroke-width="3"/>
      <polygon fill="#0969da" points="350,1868 343,1856 357,1856"/>
    </g>
  </g>
  <g font-family="Helvetica, Arial, Liberation Sans, sans-serif" id="group-normalization">
    <rect fill="#f6f8fa" height="268" rx="10" stroke="#d0d7de" stroke-width="2" width="648" x="36" y="1872"/>
    <text fill="#1f2328" font-size="44" font-weight="bold" x="56" y="1932">Normalization / policy</text>
    <line stroke="#d0d7de" stroke-width="2" x1="56" x2="664" y1="1946" y2="1946"/>
    <text fill="#0969da" font-size="40" x="56" y="1996">normalization · policy</text>
    <text fill="#57606a" font-size="40" x="56" y="2060">pure; no provider import</text>
    <text fill="#57606a" font-size="40" x="56" y="2112">decision per capture</text>
    <g data-source="normalization" data-target="assessment" id="edge-normalization-assessment">
      <polyline fill="none" points="350,2144 350,2254" stroke="#0969da" stroke-width="3"/>
      <polygon fill="#0969da" points="350,2266 343,2254 357,2254"/>
      <text fill="#57606a" font-size="40" text-anchor="start" x="362" y="2225">decisions</text>
    </g>
  </g>
  <g font-family="Helvetica, Arial, Liberation Sans, sans-serif" id="group-assessment">
    <rect fill="#f6f8fa" height="422" rx="10" stroke="#d0d7de" stroke-width="2" width="648" x="36" y="2270"/>
    <text fill="#1f2328" font-size="44" font-weight="bold" x="56" y="2330">Assessment / statistics</text>
    <text fill="#1f2328" font-size="44" font-weight="bold" x="56" y="2380">faults</text>
    <line stroke="#d0d7de" stroke-width="2" x1="56" x2="664" y1="2394" y2="2394"/>
    <text fill="#0969da" font-size="40" x="56" y="2444">assessment · stats · faults</text>
    <text fill="#0969da" font-size="40" x="56" y="2496">selection</text>
    <text fill="#57606a" font-size="40" x="56" y="2560">6 synthetic faults; no model call</text>
    <text fill="#57606a" font-size="40" x="56" y="2612">recomputes decisions, then the</text>
    <text fill="#57606a" font-size="40" x="56" y="2664">verdict</text>
    <g data-source="assessment" data-target="evidence" id="edge-assessment-evidence">
      <polyline fill="none" points="350,2696 350,2806" stroke="#0969da" stroke-width="3"/>
      <polygon fill="#0969da" points="350,2818 343,2806 357,2806"/>
      <text fill="#57606a" font-size="40" text-anchor="start" x="362" y="2751">verdict, records,</text>
      <text fill="#57606a" font-size="40" text-anchor="start" x="362" y="2803">faults</text>
    </g>
  </g>
  <g font-family="Helvetica, Arial, Liberation Sans, sans-serif" id="group-evidence">
    <rect fill="#f6f8fa" height="268" rx="10" stroke="#d0d7de" stroke-width="2" width="648" x="36" y="2822"/>
    <text fill="#1f2328" font-size="44" font-weight="bold" x="56" y="2882">Evidence</text>
    <line stroke="#d0d7de" stroke-width="2" x1="56" x2="664" y1="2896" y2="2896"/>
    <text fill="#0969da" font-size="40" x="56" y="2946">evidence</text>
    <text fill="#57606a" font-size="40" x="56" y="3010">7-file bundle, bounded</text>
    <text fill="#57606a" font-size="40" x="56" y="3062">atomic publish</text>
    <g data-source="evidence" data-target="replay" id="edge-evidence-replay">
      <polyline fill="none" points="350,3094 350,3204" stroke="#0969da" stroke-width="3"/>
      <polygon fill="#0969da" points="350,3216 343,3204 357,3204"/>
    </g>
  </g>
  <g font-family="Helvetica, Arial, Liberation Sans, sans-serif" id="group-replay">
    <rect fill="#f6f8fa" height="268" rx="10" stroke="#d0d7de" stroke-width="2" width="648" x="36" y="3220"/>
    <text fill="#1f2328" font-size="44" font-weight="bold" x="56" y="3280">Replay</text>
    <line stroke="#d0d7de" stroke-width="2" x1="56" x2="664" y1="3294" y2="3294"/>
    <text fill="#0969da" font-size="40" x="56" y="3344">replay</text>
    <text fill="#57606a" font-size="40" x="56" y="3408">offline; no provider import</text>
    <text fill="#57606a" font-size="40" x="56" y="3460">recomputes the verdict</text>
    <g data-source="replay" data-target="contracts" id="edge-replay-contracts">
      <polyline fill="none" points="32,3464 12,3464 12,372 20,372" stroke="#57606a" stroke-width="3"/>
      <polygon fill="#57606a" points="32,372 20,365 20,379"/>
      <text fill="#57606a" font-size="40" text-anchor="start" x="36" y="448">lock, inputs</text>
    </g>
    <g data-source="replay" data-target="assessment" id="edge-replay-assessment">
      <polyline fill="none" points="32,3244 24,3244 24,2668 20,2668" stroke="#57606a" stroke-width="3"/>
      <polygon fill="#57606a" points="32,2668 20,2661 20,2675"/>
      <text fill="#57606a" font-size="40" text-anchor="start" x="36" y="2744">recompute</text>
    </g>
  </g>
</svg>
