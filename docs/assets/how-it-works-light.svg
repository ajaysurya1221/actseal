<?xml version="1.0" encoding="UTF-8"?>
<svg aria-labelledby="title desc" height="400" role="img" viewBox="0 0 1600 400" width="1600" xmlns="http://www.w3.org/2000/svg">
  <title id="title">How Actseal works: freeze, run, verify, seal, replay</title>
  <desc id="desc">Five stages in order. Freeze turns the frozen policy, the labelled inputs and the model identity into one lock. Run collects provider answers for the locked verification cases and evaluates six synthetic fault scenarios, turning each into a decision: ACT, ABSTAIN, ESCALATE or DENY. Verify applies risk and coverage bounds and the fault rules to reach one verdict with its exit code: PASS 0, BLOCK 1, INCONCLUSIVE 2 or ERROR 3. Seal writes the lock, answers, decisions and verdict into one bounded evidence bundle. Replay recomputes the verdict from that bundle offline, with no model call and no provider loaded. The lock command performs Freeze, the verify command performs Run, Verify and Seal, and the replay command performs Replay.</desc>
  <rect fill="#ffffff" height="400" width="1600" x="0" y="0"/>
  <g font-family="Helvetica, Arial, Liberation Sans, sans-serif" id="stage-freeze">
    <rect fill="#f6f8fa" height="293" rx="10" stroke="#d0d7de" stroke-width="2" width="294.4" x="16" y="24"/>
    <text fill="#1f2328" font-size="34" font-weight="bold" x="28" y="74"><tspan fill="#0969da">1</tspan> <tspan dx="6">Freeze</tspan></text>
    <line stroke="#d0d7de" stroke-width="2" x1="28" x2="298.4" y1="90" y2="90"/>
    <text fill="#24292f" font-size="27" x="28" y="125">frozen policy</text>
    <text fill="#24292f" font-size="27" x="28" y="159">+ labelled inputs</text>
    <text fill="#24292f" font-size="27" x="28" y="193">+ model identity</text>
    <text fill="#0969da" font-size="27" x="28" y="227">→ lock</text>
    <line stroke="#0969da" stroke-width="3" x1="313.4" x2="319.4" y1="170.5" y2="170.5"/>
    <polygon fill="#0969da" points="331.4,170.5 319.4,162.5 319.4,178.5"/>
  </g>
  <g font-family="Helvetica, Arial, Liberation Sans, sans-serif" id="stage-run">
    <rect fill="#f6f8fa" height="293" rx="10" stroke="#d0d7de" stroke-width="2" width="294.4" x="334.4" y="24"/>
    <text fill="#1f2328" font-size="34" font-weight="bold" x="346.4" y="74"><tspan fill="#0969da">2</tspan> <tspan dx="6">Run</tspan></text>
    <line stroke="#d0d7de" stroke-width="2" x1="346.4" x2="616.8" y1="90" y2="90"/>
    <text fill="#24292f" font-size="27" x="346.4" y="125">provider answers</text>
    <text fill="#24292f" font-size="27" x="346.4" y="159">verification cases</text>
    <text fill="#24292f" font-size="27" x="346.4" y="193">+ 6 synthetic faults</text>
    <text fill="#0969da" font-size="27" x="346.4" y="227">→ ACT · ABSTAIN</text>
    <text fill="#0969da" font-size="27" x="346.4" y="261">ESCALATE · DENY</text>
    <line stroke="#0969da" stroke-width="3" x1="631.8" x2="637.8" y1="170.5" y2="170.5"/>
    <polygon fill="#0969da" points="649.8,170.5 637.8,162.5 637.8,178.5"/>
  </g>
  <g font-family="Helvetica, Arial, Liberation Sans, sans-serif" id="stage-verify">
    <rect fill="#f6f8fa" height="293" rx="10" stroke="#d0d7de" stroke-width="2" width="294.4" x="652.8" y="24"/>
    <text fill="#1f2328" font-size="34" font-weight="bold" x="664.8" y="74"><tspan fill="#0969da">3</tspan> <tspan dx="6">Verify</tspan></text>
    <line stroke="#d0d7de" stroke-width="2" x1="664.8" x2="935.2" y1="90" y2="90"/>
    <text fill="#24292f" font-size="27" x="664.8" y="125">risk + coverage</text>
    <text fill="#24292f" font-size="27" x="664.8" y="159">bounds, fault rules</text>
    <text fill="#24292f" font-size="27" x="664.8" y="193">→ verdict, exit code:</text>
    <text fill="#0969da" font-size="27" x="664.8" y="227">PASS 0 · BLOCK 1</text>
    <text fill="#0969da" font-size="27" x="664.8" y="261">INCONCLUSIVE 2</text>
    <text fill="#0969da" font-size="27" x="664.8" y="295">ERROR 3</text>
    <line stroke="#0969da" stroke-width="3" x1="950.2" x2="956.2" y1="170.5" y2="170.5"/>
    <polygon fill="#0969da" points="968.2,170.5 956.2,162.5 956.2,178.5"/>
  </g>
  <g font-family="Helvetica, Arial, Liberation Sans, sans-serif" id="stage-seal">
    <rect fill="#f6f8fa" height="293" rx="10" stroke="#d0d7de" stroke-width="2" width="294.4" x="971.2" y="24"/>
    <text fill="#1f2328" font-size="34" font-weight="bold" x="983.2" y="74"><tspan fill="#0969da">4</tspan> <tspan dx="6">Seal</tspan></text>
    <line stroke="#d0d7de" stroke-width="2" x1="983.2" x2="1253.6" y1="90" y2="90"/>
    <text fill="#24292f" font-size="27" x="983.2" y="125">lock + answers</text>
    <text fill="#24292f" font-size="27" x="983.2" y="159">decisions + verdict</text>
    <text fill="#0969da" font-size="27" x="983.2" y="193">→ bounded</text>
    <text fill="#0969da" font-size="27" x="983.2" y="227">evidence bundle</text>
    <line stroke="#0969da" stroke-width="3" x1="1268.6" x2="1274.6" y1="170.5" y2="170.5"/>
    <polygon fill="#0969da" points="1286.6,170.5 1274.6,162.5 1274.6,178.5"/>
  </g>
  <g font-family="Helvetica, Arial, Liberation Sans, sans-serif" id="stage-replay">
    <rect fill="#f6f8fa" height="293" rx="10" stroke="#d0d7de" stroke-width="2" width="294.4" x="1289.6" y="24"/>
    <text fill="#1f2328" font-size="34" font-weight="bold" x="1301.6" y="74"><tspan fill="#0969da">5</tspan> <tspan dx="6">Replay</tspan></text>
    <line stroke="#d0d7de" stroke-width="2" x1="1301.6" x2="1572" y1="90" y2="90"/>
    <text fill="#0969da" font-size="27" x="1301.6" y="125">offline; no model call</text>
    <text fill="#24292f" font-size="27" x="1301.6" y="159">no provider loaded</text>
    <text fill="#24292f" font-size="27" x="1301.6" y="193">recomputes verdict</text>
    <text fill="#24292f" font-size="27" x="1301.6" y="227">from the bundle</text>
  </g>
  <g font-family="Helvetica, Arial, Liberation Sans, sans-serif" id="commands">
    <path d="M24,331 V337 H302.4 V331" fill="none" stroke="#57606a" stroke-width="2"/>
    <text fill="#57606a" font-size="27" text-anchor="middle" x="163.2" y="370">actseal lock</text>
    <path d="M342.4,331 V337 H1257.6 V331" fill="none" stroke="#57606a" stroke-width="2"/>
    <text fill="#57606a" font-size="27" text-anchor="middle" x="800" y="370">actseal verify</text>
    <path d="M1297.6,331 V337 H1576 V331" fill="none" stroke="#57606a" stroke-width="2"/>
    <text fill="#57606a" font-size="27" text-anchor="middle" x="1436.8" y="370">actseal replay</text>
  </g>
</svg>
