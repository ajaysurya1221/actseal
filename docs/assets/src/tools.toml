# Authoring-only pins for Actseal documentation assets. Nothing here is a
# runtime dependency. Hashes were verified during the approved v1 audit and are
# re-verified by setup_tools.py on download and by render.py before any tool
# executes. Artifact URLs follow the upstream release naming at the pinned
# tag; the SHA-256 is the authority if a URL is wrong.

[fonttools]
version = "4.66.1"
license = "MIT"
license_url = "https://github.com/fonttools/fonttools/blob/4.66.1/LICENSE"
source_url = "https://github.com/fonttools/fonttools/tree/4.66.1"
kind = "python"
purpose = "Outline pinned banner glyphs; installed through the uv `assets` group, never downloaded here"

[[fonttools.artifacts]]
platform = "any"
url = "https://files.pythonhosted.org/packages/f6/10/d45b74135d5d642cb3a4fb0a957c1613ef93de4c8548671dfc3a5bf38299/fonttools-4.66.1-py3-none-any.whl"
filename = "fonttools-4.66.1-py3-none-any.whl"
sha256 = "7234ae9e28db64273fbbfa72caebd0a97e3bdba6b05064114741b9539ef339d0"

