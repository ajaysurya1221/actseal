<?xml version="1.0" encoding="UTF-8"?>
<svg aria-labelledby="title desc" height="980" role="img" viewBox="0 0 1600 980" width="1600" xmlns="http://www.w3.org/2000/svg">
  <title id="title">Actseal architecture: seven shipped groups and their modules</title>
  <desc id="desc">Seven groups, each listing the actseal modules that implement it. Contracts and locks: contract, records, errors, serialization, locking and compatibility parse, seal and validate the lock with no model call. CLI and typed API: cli, runner, __init__, __main__ and demo_data drive the lock, verify, replay and demo commands. Providers: adapters.base, adapters.fixture, adapters.laya and the PROVISIONAL experimental.providers.jev; the dashed live-inference boundary encloses the Laya and Jev adapters, because the fixture adapter reads a recorded file. Fixture and Laya are the stable providers; Jev is an experimental cloud adapter selected only by explicit opt-in, with no stability promise and no claim here that its service was exercised. Normalization and policy: normalization and policy are pure functions that turn one raw capture into one decision. Assessment, statistics and faults: assessment, stats and faults; the six fault scenarios are synthetic, generated from the lock with no model call, and assessment recomputes every decision before the verdict. Evidence: evidence writes the seven-file bounded data-only bundle atomically. Replay: replay reads the bundle and recomputes the verdict offline through contracts and assessment; no arrow joins replay and providers, and replay imports no provider module.</desc>
  <rect fill="#0d1117" height="980" width="1600" x="0" y="0"/>
  <g font-family="Helvetica, Arial, Liberation Sans, sans-serif" id="group-contracts">
    <rect fill="#161b22" height="392" rx="10" stroke="#30363d" stroke-width="2" width="371" x="16" y="24"/>
    <text fill="#e6edf3" font-size="32" font-weight="bold" x="28" y="70">Contracts / locks</text>
    <line stroke="#30363d" stroke-width="2" x1="28" x2="375" y1="82" y2="82"/>
    <text fill="#58a6ff" font-size="27" x="28" y="117">contract · records · errors</text>
    <text fill="#58a6ff" font-size="27" x="28" y="151">serialization · locking</text>
    <text fill="#58a6ff" font-size="27" x="28" y="185">compatibility</text>
    <text fill="#8b949e" font-size="27" x="28" y="229">parse, seal, validate</text>
    <text fill="#8b949e" font-size="27" x="28" y="263">no model call</text>
    <g data-source="contracts" data-target="assessment" id="edge-contracts-assessment">
      <polyline fill="none" points="201.5,420 201.5,456 495,456 495,480" stroke="#58a6ff" stroke-width="3"/>
      <polygon fill="#58a6ff" points="495,492 488,480 502,480"/>
      <text fill="#8b949e" font-size="27" text-anchor="start" x="213.5" y="444">6 synthetic faults</text>
    </g>
  </g>
  <g font-family="Helvetica, Arial, Liberation Sans, sans-serif" id="group-cli">
    <rect fill="#161b22" height="392" rx="10" stroke="#30363d" stroke-width="2" width="371" x="415" y="24"/>
    <text fill="#e6edf3" font-size="32" font-weight="bold" x="427" y="70">CLI / typed API</text>
    <line stroke="#30363d" stroke-width="2" x1="427" x2="774" y1="82" y2="82"/>
    <text fill="#58a6ff" font-size="27" x="427" y="117">cli · runner · __init__</text>
    <text fill="#58a6ff" font-size="27" x="427" y="151">__main__ · demo_data</text>
    <text fill="#8b949e" font-size="27" x="427" y="195">lock, verify, replay, demo</text>
    <g data-source="cli" data-target="contracts" id="edge-cli-contracts">
      <polyline fill="none" points="411,220 403,220" stroke="#58a6ff" stroke-width="3"/>
      <polygon fill="#58a6ff" points="391,220 403,213 403,227"/>
    </g>
    <g data-source="cli" data-target="providers" id="edge-cli-providers">
      <polyline fill="none" points="790,220 798,220" stroke="#58a6ff" stroke-width="3"/>
      <polygon fill="#58a6ff" points="810,220 798,213 798,227"/>
    </g>
  </g>
  <g font-family="Helvetica, Arial, Liberation Sans, sans-serif" id="group-providers">
    <rect fill="#161b22" height="392" rx="10" stroke="#30363d" stroke-width="2" width="371" x="814" y="24"/>
    <text fill="#e6edf3" font-size="32" font-weight="bold" x="826" y="70">Providers</text>
    <line stroke="#30363d" stroke-width="2" x1="826" x2="1173" y1="82" y2="82"/>
    <text fill="#58a6ff" font-size="27" x="826" y="117">adapters.base</text>
    <text fill="#58a6ff" font-size="27" x="826" y="151">adapters.fixture</text>
    <g id="live-boundary-providers">
      <rect fill="none" height="118" rx="6" stroke="#58a6ff" stroke-dasharray="8 6" stroke-width="2" width="363" x="818" y="160"/>
      <text fill="#58a6ff" font-size="27" x="826" y="195">adapters.laya</text>
      <text fill="#58a6ff" font-size="27" x="826" y="229">experimental.providers.jev</text>
      <text fill="#8b949e" font-size="27" x="826" y="263">live inference</text>
    </g>
    <text fill="#8b949e" font-size="27" x="826" y="325">fixture: recorded file</text>
    <text fill="#8b949e" font-size="27" x="826" y="359">laya: pinned checkpoint</text>
    <text fill="#8b949e" font-size="27" x="826" y="393">jev: PROVISIONAL opt-in</text>
    <g data-source="providers" data-target="normalization" id="edge-providers-normalization">
      <polyline fill="none" points="1189,220 1197,220" stroke="#58a6ff" stroke-width="3"/>
      <polygon fill="#58a6ff" points="1209,220 1197,213 1197,227"/>
    </g>
  </g>
  <g font-family="Helvetica, Arial, Liberation Sans, sans-serif" id="group-normalization">
    <rect fill="#161b22" height="392" rx="10" stroke="#30363d" stroke-width="2" width="371" x="1213" y="24"/>
    <text fill="#e6edf3" font-size="32" font-weight="bold" x="1225" y="70">Normalization</text>
    <text fill="#e6edf3" font-size="32" font-weight="bold" x="1225" y="106">policy</text>
    <line stroke="#30363d" stroke-width="2" x1="1225" x2="1572" y1="118" y2="118"/>
    <text fill="#58a6ff" font-size="27" x="1225" y="153">normalization · policy</text>
    <text fill="#8b949e" font-size="27" x="1225" y="197">pure; no provider import</text>
    <text fill="#8b949e" font-size="27" x="1225" y="231">decision per capture</text>
    <g data-source="normalization" data-target="assessment" id="edge-normalization-assessment">
      <polyline fill="none" points="1398.5,420 1398.5,480" stroke="#58a6ff" stroke-width="3"/>
      <polygon fill="#58a6ff" points="1398.5,492 1391.5,480 1405.5,480"/>
      <text fill="#8b949e" font-size="27" text-anchor="start" x="1410.5" y="469.5">decisions</text>
    </g>
  </g>
  <g font-family="Helvetica, Arial, Liberation Sans, sans-serif" id="group-assessment">
    <rect fill="#161b22" height="194" rx="10" stroke="#30363d" stroke-width="2" width="1169" x="415" y="496"/>
    <text fill="#e6edf3" font-size="32" font-weight="bold" x="427" y="542">Assessment / statistics / faults</text>
    <line stroke="#30363d" stroke-width="2" x1="427" x2="1572" y1="554" y2="554"/>
    <text fill="#58a6ff" font-size="27" x="427" y="589">assessment · stats · faults</text>
    <text fill="#8b949e" font-size="27" x="427" y="633">6 synthetic faults; no model call</text>
    <text fill="#8b949e" font-size="27" x="427" y="667">recomputes decisions, then the verdict</text>
    <g data-source="assessment" data-target="evidence" id="edge-assessment-evidence">
      <polyline fill="none" points="600.5,694 600.5,734" stroke="#58a6ff" stroke-width="3"/>
      <polygon fill="#58a6ff" points="600.5,746 593.5,734 607.5,734"/>
      <text fill="#8b949e" font-size="27" text-anchor="start" x="612.5" y="733.5">verdict, records, faults</text>
    </g>
  </g>
  <g font-family="Helvetica, Arial, Liberation Sans, sans-serif" id="group-evidence">
    <rect fill="#161b22" height="194" rx="10" stroke="#30363d" stroke-width="2" width="371" x="415" y="750"/>
    <text fill="#e6edf3" font-size="32" font-weight="bold" x="427" y="796">Evidence</text>
    <line stroke="#30363d" stroke-width="2" x1="427" x2="774" y1="808" y2="808"/>
    <text fill="#58a6ff" font-size="27" x="427" y="843">evidence</text>
    <text fill="#8b949e" font-size="27" x="427" y="887">7-file bundle, bounded</text>
    <text fill="#8b949e" font-size="27" x="427" y="921">atomic publish</text>
    <g data-source="evidence" data-target="replay" id="edge-evidence-replay">
      <polyline fill="none" points="411,847 403,847" stroke="#58a6ff" stroke-width="3"/>
      <polygon fill="#58a6ff" points="391,847 403,840 403,854"/>
    </g>
  </g>
  <g font-family="Helvetica, Arial, Liberation Sans, sans-serif" id="group-replay">
    <rect fill="#161b22" height="194" rx="10" stroke="#30363d" stroke-width="2" width="371" x="16" y="750"/>
    <text fill="#e6edf3" font-size="32" font-weight="bold" x="28" y="796">Replay</text>
    <line stroke="#30363d" stroke-width="2" x1="28" x2="375" y1="808" y2="808"/>
    <text fill="#58a6ff" font-size="27" x="28" y="843">replay</text>
    <text fill="#8b949e" font-size="27" x="28" y="887">offline; no provider import</text>
    <text fill="#8b949e" font-size="27" x="28" y="921">recomputes the verdict</text>
    <g data-source="replay" data-target="contracts" id="edge-replay-contracts">
      <polyline fill="none" points="90.2,746 90.2,432" stroke="#8b949e" stroke-width="3"/>
      <polygon fill="#8b949e" points="90.2,420 83.2,432 97.2,432"/>
      <text fill="#8b949e" font-size="27" text-anchor="start" x="102.2" y="596.5">lock, inputs</text>
    </g>
    <g data-source="replay" data-target="assessment" id="edge-replay-assessment">
      <polyline fill="none" points="312.8,746 312.8,593 399,593" stroke="#8b949e" stroke-width="3"/>
      <polygon fill="#8b949e" points="411,593 399,586 399,600"/>
      <text fill="#8b949e" font-size="27" text-anchor="end" x="411" y="581">recompute</text>
    </g>
  </g>
</svg>
