<?xml version="1.0" encoding="UTF-8"?>
<svg aria-labelledby="title desc" height="2166" role="img" viewBox="0 0 720 2166" width="720" xmlns="http://www.w3.org/2000/svg">
  <title id="title">Actseal architecture: seven shipped groups and their modules</title>
  <desc id="desc">Seven groups, each listing the actseal modules that implement it. Contracts and locks: contract, records, errors, serialization, locking and compatibility parse, seal and validate the lock with no model call. CLI and typed API: cli, runner, __init__, __main__ and demo_data drive the lock, verify, replay and demo commands. Providers: adapters.base, adapters.fixture, adapters.laya and the PROVISIONAL experimental.providers.jev; the dashed live-inference boundary encloses the Laya and Jev adapters, because the fixture adapter reads a recorded file. Fixture and Laya are the stable providers; Jev is an experimental cloud adapter selected only by explicit opt-in, with no stability promise and no claim here that its service was exercised. Normalization and policy: normalization and policy are pure functions that turn one raw capture into one decision. Assessment, statistics and faults: assessment, stats and faults; the six fault scenarios are synthetic, generated from the lock with no model call, and assessment recomputes every decision before the verdict. Evidence: evidence writes the seven-file bounded data-only bundle atomically. Replay: replay reads the bundle and recomputes the verdict offline through contracts and assessment; no arrow joins replay and providers, and replay imports no provider module.</desc>
  <rect fill="#ffffff" height="2166" width="720" x="0" y="0"/>
  <g font-family="Helvetica, Arial, Liberation Sans, sans-serif" id="group-contracts">
    <rect fill="#f6f8fa" height="264" rx="10" stroke="#d0d7de" stroke-width="2" width="648" x="36" y="24"/>
    <text fill="#1f2328" font-size="36" font-weight="bold" x="56" y="76">Contracts / locks</text>
    <line stroke="#d0d7de" stroke-width="2" x1="56" x2="664" y1="90" y2="90"/>
    <text fill="#0969da" font-size="30" x="56" y="130">contract · records · errors · serialization</text>
    <text fill="#0969da" font-size="30" x="56" y="170">locking · compatibility</text>
    <text fill="#57606a" font-size="30" x="56" y="222">parse, seal, validate</text>
    <text fill="#57606a" font-size="30" x="56" y="262">no model call</text>
    <g data-source="contracts" data-target="assessment" id="edge-contracts-assessment">
      <polyline fill="none" points="688,264 708,264 708,1374 700,1374" stroke="#0969da" stroke-width="3"/>
      <polygon fill="#0969da" points="688,1374 700,1367 700,1381"/>
      <text fill="#57606a" font-size="30" text-anchor="end" x="684" y="330">6 synthetic faults</text>
    </g>
  </g>
  <g font-family="Helvetica, Arial, Liberation Sans, sans-serif" id="group-cli">
    <rect fill="#f6f8fa" height="224" rx="10" stroke="#d0d7de" stroke-width="2" width="648" x="36" y="348"/>
    <text fill="#1f2328" font-size="36" font-weight="bold" x="56" y="400">CLI / typed API</text>
    <line stroke="#d0d7de" stroke-width="2" x1="56" x2="664" y1="414" y2="414"/>
    <text fill="#0969da" font-size="30" x="56" y="454">cli · runner · __init__ · __main__</text>
    <text fill="#0969da" font-size="30" x="56" y="494">demo_data</text>
    <text fill="#57606a" font-size="30" x="56" y="546">lock, verify, replay, demo</text>
    <g data-source="cli" data-target="contracts" id="edge-cli-contracts">
      <polyline fill="none" points="350,344 350,304" stroke="#0969da" stroke-width="3"/>
      <polygon fill="#0969da" points="350,292 343,304 357,304"/>
    </g>
    <g data-source="cli" data-target="providers" id="edge-cli-providers">
      <polyline fill="none" points="350,576 350,616" stroke="#0969da" stroke-width="3"/>
      <polygon fill="#0969da" points="350,628 343,616 357,616"/>
    </g>
  </g>
  <g font-family="Helvetica, Arial, Liberation Sans, sans-serif" id="group-providers">
    <rect fill="#f6f8fa" height="374" rx="10" stroke="#d0d7de" stroke-width="2" width="648" x="36" y="632"/>
    <text fill="#1f2328" font-size="36" font-weight="bold" x="56" y="684">Providers</text>
    <line stroke="#d0d7de" stroke-width="2" x1="56" x2="664" y1="698" y2="698"/>
    <text fill="#0969da" font-size="30" x="56" y="738">adapters.base · adapters.fixture</text>
    <g id="live-boundary-providers">
      <rect fill="none" height="94" rx="6" stroke="#0969da" stroke-dasharray="8 6" stroke-width="2" width="624" x="48" y="752"/>
      <text fill="#0969da" font-size="30" x="56" y="790">adapters.laya · experimental.providers.jev</text>
      <text fill="#57606a" font-size="30" x="56" y="830">live inference</text>
    </g>
    <text fill="#57606a" font-size="30" x="56" y="900">fixture: recorded file</text>
    <text fill="#57606a" font-size="30" x="56" y="940">laya: pinned checkpoint</text>
    <text fill="#57606a" font-size="30" x="56" y="980">jev: PROVISIONAL opt-in</text>
    <g data-source="providers" data-target="normalization" id="edge-providers-normalization">
      <polyline fill="none" points="350,1010 350,1050" stroke="#0969da" stroke-width="3"/>
      <polygon fill="#0969da" points="350,1062 343,1050 357,1050"/>
    </g>
  </g>
  <g font-family="Helvetica, Arial, Liberation Sans, sans-serif" id="group-normalization">
    <rect fill="#f6f8fa" height="224" rx="10" stroke="#d0d7de" stroke-width="2" width="648" x="36" y="1066"/>
    <text fill="#1f2328" font-size="36" font-weight="bold" x="56" y="1118">Normalization / policy</text>
    <line stroke="#d0d7de" stroke-width="2" x1="56" x2="664" y1="1132" y2="1132"/>
    <text fill="#0969da" font-size="30" x="56" y="1172">normalization · policy</text>
    <text fill="#57606a" font-size="30" x="56" y="1224">pure; no provider import</text>
    <text fill="#57606a" font-size="30" x="56" y="1264">decision per capture</text>
    <g data-source="normalization" data-target="assessment" id="edge-normalization-assessment">
      <polyline fill="none" points="350,1294 350,1334" stroke="#0969da" stroke-width="3"/>
      <polygon fill="#0969da" points="350,1346 343,1334 357,1334"/>
      <text fill="#57606a" font-size="30" text-anchor="start" x="362" y="1335">decisions</text>
    </g>
  </g>
  <g font-family="Helvetica, Arial, Liberation Sans, sans-serif" id="group-assessment">
    <rect fill="#f6f8fa" height="224" rx="10" stroke="#d0d7de" stroke-width="2" width="648" x="36" y="1350"/>
    <text fill="#1f2328" font-size="36" font-weight="bold" x="56" y="1402">Assessment / statistics / faults</text>
    <line stroke="#d0d7de" stroke-width="2" x1="56" x2="664" y1="1416" y2="1416"/>
    <text fill="#0969da" font-size="30" x="56" y="1456">assessment · stats · faults</text>
    <text fill="#57606a" font-size="30" x="56" y="1508">6 synthetic faults; no model call</text>
    <text fill="#57606a" font-size="30" x="56" y="1548">recomputes decisions, then the verdict</text>
    <g data-source="assessment" data-target="evidence" id="edge-assessment-evidence">
      <polyline fill="none" points="350,1578 350,1618" stroke="#0969da" stroke-width="3"/>
      <polygon fill="#0969da" points="350,1630 343,1618 357,1618"/>
      <text fill="#57606a" font-size="30" text-anchor="start" x="362" y="1619">verdict, records, faults</text>
    </g>
  </g>
  <g font-family="Helvetica, Arial, Liberation Sans, sans-serif" id="group-evidence">
    <rect fill="#f6f8fa" height="224" rx="10" stroke="#d0d7de" stroke-width="2" width="648" x="36" y="1634"/>
    <text fill="#1f2328" font-size="36" font-weight="bold" x="56" y="1686">Evidence</text>
    <line stroke="#d0d7de" stroke-width="2" x1="56" x2="664" y1="1700" y2="1700"/>
    <text fill="#0969da" font-size="30" x="56" y="1740">evidence</text>
    <text fill="#57606a" font-size="30" x="56" y="1792">7-file bundle, bounded</text>
    <text fill="#57606a" font-size="30" x="56" y="1832">atomic publish</text>
    <g data-source="evidence" data-target="replay" id="edge-evidence-replay">
      <polyline fill="none" points="350,1862 350,1902" stroke="#0969da" stroke-width="3"/>
      <polygon fill="#0969da" points="350,1914 343,1902 357,1902"/>
    </g>
  </g>
  <g font-family="Helvetica, Arial, Liberation Sans, sans-serif" id="group-replay">
    <rect fill="#f6f8fa" height="224" rx="10" stroke="#d0d7de" stroke-width="2" width="648" x="36" y="1918"/>
    <text fill="#1f2328" font-size="36" font-weight="bold" x="56" y="1970">Replay</text>
    <line stroke="#d0d7de" stroke-width="2" x1="56" x2="664" y1="1984" y2="1984"/>
    <text fill="#0969da" font-size="30" x="56" y="2024">replay</text>
    <text fill="#57606a" font-size="30" x="56" y="2076">offline; no provider import</text>
    <text fill="#57606a" font-size="30" x="56" y="2116">recomputes the verdict</text>
    <g data-source="replay" data-target="contracts" id="edge-replay-contracts">
      <polyline fill="none" points="32,2118 12,2118 12,264 20,264" stroke="#57606a" stroke-width="3"/>
      <polygon fill="#57606a" points="32,264 20,257 20,271"/>
      <text fill="#57606a" font-size="30" text-anchor="start" x="36" y="330">lock, inputs</text>
    </g>
    <g data-source="replay" data-target="assessment" id="edge-replay-assessment">
      <polyline fill="none" points="32,1942 24,1942 24,1550 20,1550" stroke="#57606a" stroke-width="3"/>
      <polygon fill="#57606a" points="32,1550 20,1543 20,1557"/>
      <text fill="#57606a" font-size="30" text-anchor="start" x="36" y="1616">recompute</text>
    </g>
  </g>
</svg>
